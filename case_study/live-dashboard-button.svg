<svg xmlns="http://www.w3.org/2000/svg" width="300" height="60" viewBox="0 0 300 60" role="img" aria-label="View Live Dashboard">
  <title>View Live Dashboard</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22B272"/>
      <stop offset="1" stop-color="#0F7A4A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="300" height="60" rx="30" fill="url(#bg)"/>
  <rect x="2" y="2" width="296" height="28" rx="14" fill="url(#shine)"/>

  <!-- medical cross badge -->
  <circle cx="34" cy="30" r="18" fill="#FFFFFF"/>
  <rect x="30.5" y="20" width="7" height="20" rx="2" fill="#16995F"/>
  <rect x="24" y="26.5" width="20" height="7" rx="2" fill="#16995F"/>

  <text x="64" y="36" fill="#FFFFFF"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="0.3">View Live Dashboard</text>

  <!-- arrow -->
  <path d="M254 30 H272 M265 23 L272 30 L265 37" fill="none" stroke="#FFFFFF"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
